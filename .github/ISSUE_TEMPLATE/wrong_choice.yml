name: Wrong model or effort for a message
description: The rules read a message at the wrong tier
labels: [classifier]
body:
  - type: textarea
    id: share
    attributes:
      label: What /gear share printed
      description: Mark the decision first (/gear wrong weak or strong), then type /gear share and paste its block here. It holds no words of your message, only its language, its size and the cue words the rules matched.
      render: text
  - type: textarea
    id: message
    attributes:
      label: The message (optional)
      description: The text, or a rewrite of it that behaves the same, if you are willing to share it. Leave out anything private. The block above is enough on its own.
  - type: input
    id: language
    attributes:
      label: Language of the message
      description: Only if you left the block out.
  - type: dropdown
    id: tier
    attributes:
      label: What it should have been
      options:
        - T0 trivial (Haiku)
        - T1 routine (Sonnet, medium)
        - T2 standard (Sonnet, medium)
        - T3 hard (Sonnet, high)
        - T4 critical (Opus)
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What autogear chose
      description: The line under the answer, or the row from /gear log.
